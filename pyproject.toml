[project]
name = "finorch"
version = "0.1.0"
description = "Financial Orchestrator - analist dijital ikizi (Faz 1: icerik toplama + AI sinyal cikarimi + uyari)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.0",
    "apscheduler>=3.10",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "yt-dlp>=2024.8.6",
    "twscrape>=0.13",
    "yfinance>=0.2.40",
    "faster-whisper>=1.0.3",
    "openai>=1.40",
    "tenacity>=8.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
]

[project.scripts]
finorch = "finorch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
